name: Release

on:
  push:
    tags: ["*"]

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-uv
      - name: Build the distribution
        run: tox -e dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
