name: Release

on:
  push:
    # Only version tags publish, so that other tags cannot trigger a release.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+[ab.]*"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab.]*"
  workflow_dispatch:
    inputs:
      index:
        description: The package index to publish to.
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-uv
      - name: Run the tests
        run: tox -e py3.13
        env:
          MPLBACKEND: AGG

  publish:
    name: Publish
    # An upload to a package index cannot be undone, so never publish a tag
    # whose tests do not pass.
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.index || 'pypi' }}
    permissions:
      # Required for trusted publishing, which needs no token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from the tags.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-uv
      - name: Build the distribution
        run: tox -e dist
      - name: Check the metadata rendered by the index
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: github.event.inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event.inputs.index != 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
